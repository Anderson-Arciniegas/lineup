<nav
  class="flex flex-row justify-between items-center py-3 px-3 md:px-4 lg:pe-9 bg-primary-50 shadow h-18 sm:h-20"
  [class.lg:ps-9]="!showSidebarToggle"
>
  <div class="flex flex-row items-center gap-1 sm:gap-5 min-w-0">
    @if (showSidebarToggle) {
      <lib-button
        [icon]="'pi pi-bars'"
        [variant]="'text'"
        [type]="'rounded'"
        [size]="'large'"
        width="w-13"
        [attr.aria-expanded]="sidebarOpen"
        [attr.aria-label]="
          (sidebarOpen
            ? 'layout.sidebar.collapseMenu'
            : 'layout.sidebar.expandMenu'
          ) | translate
        "
        (action)="emitSidebarToggle()"
      ></lib-button>
    }
    <a routerLink="/" class="flex flex-row items-center gap-3 min-w-0">
      <span
        class="text-lg sm:text-xl font-semibold text-primary-800 truncate"
        >{{ 'admin.title' | translate }}</span
      >
    </a>
  </div>
</nav>
