<div class="w-full h-dvh max-h-dvh overflow-hidden flex flex-col">
  <lib-nav
    [showSidebarToggle]="true"
    [sidebarOpen]="sidebarOpen()"
    (sidebarToggle)="toggleSidebar()"
  ></lib-nav>
  <section class="layout-main w-full min-w-0 min-h-0 flex-1">
    @if (sidebarOpen()) {
    <div
      class="sidebar-backdrop"
      (click)="closeSidebar()"
      role="presentation"
      aria-hidden="true"
    ></div>
    }
    <div class="sidebar-dock" [class.sidebar-dock--open]="sidebarOpen()">
      <lib-sidebar
        class="sidebar-dock__sidebar"
        [items]="items()"
        [iconOnly]="!sidebarOpen()"
        [overlayMode]="sidebarOpen()"
      ></lib-sidebar>
    </div>
    <div class="page layout-main__content">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
