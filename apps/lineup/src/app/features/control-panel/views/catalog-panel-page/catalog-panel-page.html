<section
  class="w-full px-3 py-5 sm:px-6 gap-8 flex flex-col duration-500 justify-start items-center"
  infiniteScroll
  [infiniteScrollDistance]="2"
  [infiniteScrollThrottle]="50"
  [scrollWindow]="false"
  [infiniteScrollDisabled]="attempt || noMoreResults"
  (scrolled)="onScroll()"
>
  <lib-product-breadcrumb
    class="w-full"
    [business]="business"
  ></lib-product-breadcrumb>
  @if (catalog) {
  <div
    class="w-full flex flex-col items-center justify-start px-0 2xl:px-4 gap-5"
  >
    <div
      class="flex flex-col sm:flex-row items-center justify-start gap-5 w-full"
    >
      <img
        [src]="catalog.image.url"
        alt="Catalog Image"
        class="w-40 h-40 catalog-image"
      />
      <div
        class="flex flex-col items-center sm:items-start justify-start gap-4"
      >
        <div
          class="flex flex-row items-center justify-center sm:justify-start gap-4"
        >
          <h3 class="text-xl sm:text-2xl 2xl:text-3xl text-center font-medium">
            {{catalog.title || 'Zapatos'}}
          </h3>

          <div class="flex flex-row items-center justify-center gap-3">
            <lib-button
              [icon]="'pi pi-pencil'"
              [width]="'w-11'"
              [color]="'primary'"
              [type]="'rounded'"
              [link]="'edit'"
            ></lib-button>

            <lib-button
              [icon]="'pi pi-trash'"
              [width]="'w-11'"
              [color]="'danger'"
              [type]="'rounded'"
              [loading]="deleteAttempt"
              (action)="deleteCatalog()"
            ></lib-button>
          </div>
        </div>
        <div class="flex flex-row items-center justify-start gap-2">
          <div class="flex flex-row items-center justify-start gap-2 flex-wrap">
            @for (tag of catalog.tags; track $index) {
            <p-chip
              class="bg-primary-500 text-white font-medium py-1 px-4"
              [label]="tag"
            />
            }
          </div>
        </div>
      </div>
    </div>
    <div
      class="w-full flex flex-col md:flex-row items-center justify-center gap-5 md:gap-4"
    >
      <div
        class="max-w-80 flex items-center justify-center bg-primary-50 search gap-2 sm:gap-5 px-4 sm:px-5 w-80"
      >
        <p-iconfield class="w-full max-width">
          <p-inputicon class="pi pi-search" />
          <input
            type="text"
            class="w-full input font-medium"
            pInputText
            [placeholder]="'general.search' | translate"
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearchSubmit()"
          />
        </p-iconfield>

        <lib-button
          [width]="'w-9'"
          icon="pi pi-search"
          type="rounded"
          size="small"
          class="block"
          (action)="onSearchSubmit()"
        >
        </lib-button>
      </div>
      <lib-button
        icon="pi pi-plus"
        [width]="'w-50'"
        type="rounded"
        [label]="'general.createProduct' | translate"
        [link]="'create-product'"
      >
      </lib-button>
    </div>
  </div>
  }
  <div class="flex flex-col items-center gap-10 w-11/12">
    <div
      class="flex flex-col gap-3 md:gap-5 p-4 w-full px-0 lg:px-4 max-w-screen-2xl"
    >
      @for (product of products; track product.id) {
      <lib-product-item
        [product]="product"
        [rates]="rates"
        (productDeletionEvent)="deleteProduct($event)"
      ></lib-product-item>
      }
    </div>

    @if(productsAttempt || attempt) {
    <div class="item flex justify-center p-10 mt-10 w-full">
      <p-progress-spinner
        strokeWidth="4"
        [style]="{ width: '100px', height: '100px' }"
      />
    </div>
    } @if(!productsAttempt && products.length === 0 && !attempt) {
    <div
      class="p-6 rounded-xl bg-gray-50 border border-gray-200 text-gray-600 w-full"
    >
      <span class="font-medium"
        >{{'general.noCatalogProducts' | translate}}</span
      >
    </div>
    }
  </div>
</section>
