<section class="pt-12 px-5 2xl:px-15 flex flex-col gap-4 sm:gap-8 items-center justify-start container">
    <section class="w-10/10 flex flex-col gap-10 items-center justify-start">
        <div class="
        w-full
        flex flex-row
        items-center justify-center
        ">
            <div class="
                    flex
                    items-center
                    justify-center
                    bg-primary-50
                    search
                    gap-2
                    sm:gap-5
                    px-3
                    sm:px-8 ">
                <p-iconfield class="
                    w-full
                    max-width">
                    <p-inputicon class="pi pi-search" />
                    <input type="text"
                           class="w-full input font-medium"
                           pInputText
                           placeholder="Search" />
                </p-iconfield>
                <lib-button label="Buscar"
                            icon="pi pi-search"
                            type="rounded"
                            class="hidden sm:block">
                </lib-button>
                <lib-button width="w-10 h-10"
                            icon="pi pi-search"
                            type="rounded"
                            class="block sm:hidden">
                </lib-button>
            </div>
        </div>
        <div class="
        w-full
        flex flex-row
        items-center justify-center
    
        ">
            <div class="
         flex
         flex-row
         items-center
         justify-center
         categories
         gap-2
         sm:gap-6
         px-3
         sm:px-7
         w-10/10">
                <div class="flex flex-wrap gap-2 justify-around w-10/10">
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Todo"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Accesorios"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Tecnología"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Tecnología"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Zapatos"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Hogar"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Hogar"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>
                    <lib-button class="mb-2 lg:w-1/9 sm:w-2/9 w-4/10"
                                [color]="'secondary'"
                                label="Gaming"
                                type="rounded"
                                [width]="'w-full'"
                                [size]="'small'">
                    </lib-button>

                </div>
            </div>
        </div>
    </section>

    <div class="
        flex flex-col
        items-start justify-center
        gap-5
        w-10/10">
        <h3 class="font-medium text-3xl pl-10">Negocios destacados</h3>
        <div class="card w-10/10">
            <p-carousel [value]="products"
                        [numVisible]="5"
                        [numScroll]="1"
                        [circular]="true"
                        [responsiveOptions]="responsiveOptions"
                        autoplayInterval="3000">
                <ng-template let-product
                             #item>
                    <lib-business-card class="cursor-pointer w-45 my-8"
                                       [width]="'w-45'"
                                       [height]="'h-50'"></lib-business-card>

                </ng-template>
            </p-carousel>
        </div>
    </div>

    <div class="
        flex flex-col
        items-start justify-center
        gap-5
        w-10/10">
        <h3 class="font-medium text-3xl pl-10">Catalogos destacados</h3>
        <div class="card w-10/10">
            <p-carousel [value]="products"
                        [numVisible]="5"
                        [numScroll]="1"
                        [circular]="true"
                        [responsiveOptions]="responsiveOptions"
                        autoplayInterval="300000">
                <ng-template let-product
                             #item>
                    <div class="w-full flex flex-col justify-center items-center">
                        <lib-catalog-card class="cursor-pointer my-8 w-45 h-50"
                                          [width]="'w-45'"
                                          [height]="'h-50'"></lib-catalog-card>
                    </div>


                </ng-template>
            </p-carousel>
        </div>
    </div>

    <div class="
        flex flex-col
        items-start justify-center
        gap-5
        w-10/10">
        <h3 class="font-medium text-3xl pl-10">Productos destacados</h3>
        <div class="
                w-full
                grid
                [grid-template-columns:repeat(1,auto)]
                sm:[grid-template-columns:repeat(2,auto)]
                md:[grid-template-columns:repeat(2,auto)]
                lg:[grid-template-columns:repeat(3,auto)]
                xl:[grid-template-columns:repeat(4,auto)]
                justify-center
                sm:justify-between
                gap-2
                sm:gap-6
                px-1 sm:px-4 md:px-15
                mb-10
            ">
            @for (product of products; track product.id) {
            <lib-product-card class="my-3"
                              [width]="'w-65'"
                              [index]="product.id"></lib-product-card>
            }
            @for (product of products; track product.id) {
            <lib-product-card class="my-3"
                              [width]="'w-65'"
                              [index]="product.id"></lib-product-card>
            }
        </div>
    </div>


</section>
