<section
  class="flex flex-col items-center justify-center w-full py-2 sm:py-10 px-2 sm:px-10"
>
  <lib-product-breadcrumb class="w-10/10"></lib-product-breadcrumb>
  <div
    class="container flex flex-col items-center justify-center gap-4 sm:gap-8 w-full"
  >
    <lib-business-data [business]="business"></lib-business-data>
    <div class="w-full flex flex-col items-center justify-center gap-6">
      <!-- <div class="w-full px-6 sm:px-10 md:px-26 lg:px:22 xl:px-46">
        <h2 class="text-4xl font-semibold text-center sm:text-left">LineUps</h2>
      </div> -->
      <div
        class="w-full grid [grid-template-columns:repeat(1,auto)] sm:[grid-template-columns:repeat(2,auto)] md:[grid-template-columns:repeat(2,auto)] lg:[grid-template-columns:repeat(3,auto)] xl:[grid-template-columns:repeat(4,auto)] gap-6 px-1 sm:px-4 md:px-15 mb-10"
      >
        @if (business) {
        <lib-create-catalog-card
          [business]="business"
          [width]="'w-72'"
          [height]="'h-80'"
        ></lib-create-catalog-card>
        } @for (catalog of catalogs; track catalog.id) {
        <lib-catalog-card
          [width]="'w-72'"
          [height]="'h-80'"
          [catalog]="catalog"
        ></lib-catalog-card>
        }
        <!-- <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card>
        <lib-catalog-card [width]="'w-72'" [height]="'h-80'"></lib-catalog-card> -->
      </div>
    </div>
  </div>
</section>
