<div class="w-full py-2 sm:py-5 px-2 sm:px-10 gap-8 flex flex-col">
  <lib-product-breadcrumb [business]="business"></lib-product-breadcrumb>
  @if (product) {
  <div class="w-full flex flex-col gap-6">
    <div class="w-full flex flex-row items-center justify-center">
      <h3 class="text-3xl font-medium text-center">
        {{product.title || 'Baltimore Ravens Jerseys'}}
      </h3>
    </div>

    <div class="card w-10/10">
      <p-carousel
        [value]="images"
        [numVisible]="3"
        [numScroll]="1"
        [showIndicators]="false"
        [circular]="true"
        [responsiveOptions]="responsiveOptions"
        (onPage)="onPage($event)"
        autoplayInterval="8000"
      >
        <ng-template let-image #item>
          <section
            class="flex flex-row items-center justify-center p-1 sm:py-3 sm:mx-2"
          >
            <p-image
              [src]="image"
              [preview]="true"
              [appendTo]="'body'"
              imageClass="carousel-image w-10/10"
              alt=""
            />
          </section>

          <!-- <div [hidden]="imageLoaded"
                         class="carousel-image-skeleton max-h-64 md:max-h-80 lg:max-h-screen w-10/10 sm:w-8/10 lg:w-4/10 flex items-center justify-center">

                    </div> -->
        </ng-template>
      </p-carousel>
    </div>
    <!-- <div class="w-full flex flex-row gap-6 items-center justify-center">
            <p-skeleton width="340px"
                        height="340px" />
            <p-skeleton width="340px"
                        height="340px" />
            <p-skeleton width="340px"
                        height="340px" />
            <p-skeleton width="340px"
                        height="340px" />
        </div>
        <div class="w-full flex flex-row gap-3 items-center justify-center">
            <p-skeleton width="50px"
                        height="50px" />
            <p-skeleton width="50px"
                        height="50px" />
            <p-skeleton width="50px"
                        height="50px" />
            <p-skeleton width="50px"
                        height="50px" />
        </div> -->
  </div>
  <lib-product-info [product]="product"></lib-product-info>
  } @if(attempt) {
  <div class="card flex justify-center p-10 mt-10">
    <p-progress-spinner
      strokeWidth="4"
      [style]="{ width: '100px', height: '100px' }"
    />
  </div>
  }
  <div class="w-full mt-10 gap-6 flex flex-row items-center justify-center">
    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-4 w-9/10 px-4 lg:px-10 max-w-screen-2xl"
    >
      <lib-product-card [width]="'w-full'" [height]="'h-70'"></lib-product-card>
      <lib-product-card [width]="'w-full'" [height]="'h-70'"></lib-product-card>
      <lib-product-card [width]="'w-full'" [height]="'h-70'"></lib-product-card>
      <lib-product-card [width]="'w-full'" [height]="'h-70'"></lib-product-card>
    </div>
  </div>
</div>
