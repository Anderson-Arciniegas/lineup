<section
  class="catalog-page w-full py-2 sm:py-5 px-2 sm:px-10 gap-5 flex flex-col"
  [ngStyle]="{'background': bgColor}"
>
  <lib-product-breadcrumb [business]="business"></lib-product-breadcrumb>
  @if (catalog) {
  <div>
    <h3 class="text-4xl text-center font-medium">
      {{catalog.title || 'Catalogo'}}
    </h3>
  </div>
  <div class="w-full flex flex-col items-center gap-10 md:gap-20">
    @if (products.length > 0) {
    <div class="flex flex-row items-center justify-center w-10/10">
      <lib-catalog-carousel
        [products]="products"
        class="w-10/10"
        (setColor)="setColor($event)"
      >
      </lib-catalog-carousel>
    </div>
    <div class="flex flex-row items-center justify-center w-full w-full">
      <lib-search-bar
        class="w-full max-w-200"
        (searchSubmit)="onSearchSubmit($event)"
      ></lib-search-bar>
    </div>
    }
    <div
      class="container w-full products-grid"
      infiniteScroll
      [infiniteScrollDistance]="2"
      [infiniteScrollThrottle]="50"
      [scrollWindow]="true"
      [infiniteScrollDisabled]="attempt || productsAttempt || noMoreResults"
      (scrolled)="onScroll()"
    >
      @if (myBusiness && ((!productsAttempt && !attempt) || (products.length > 0
      || noMoreResults))) {
      <div class="w-full flex flex-col items-center justify-center">
        <lib-create-product-card
          [width]="'w-65'"
          [height]="'h-100'"
        ></lib-create-product-card>
      </div>
      } @for (product of products; track product.id) {
      <div class="w-full flex flex-col items-center justify-center">
        <lib-product-card
          [width]="'w-65'"
          [height]="'h-100'"
          [product]="product"
        />
      </div>
      }
    </div>
  </div>

  } @if(attempt || productsAttempt) {
  <div class="flex flex-col justify-center items-center w-full">
    <div class="card flex justify-center p-10">
      <p-progress-spinner
        strokeWidth="4"
        [style]="{ width: '100px', height: '100px' }"
      />
    </div>
  </div>
  }
</section>
