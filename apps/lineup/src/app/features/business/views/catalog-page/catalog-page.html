<section class="
    w-full 
    px-4 sm:py-10 
    px-2 sm:px-10 
    gap-8
    flex flex-col
">
    <lib-product-breadcrumb [business]="business"></lib-product-breadcrumb>

    <div>
        <h3 class="text-4xl text-center font-medium">Zapatos</h3>
    </div>

    <div class="
        w-full
        flex flex-row
        items-center justify-center
        ">
        <div class="
         flex
         items-center
         justify-center
         bg-primary-50
         search
         gap-2
         sm:gap-6
         px-3
         sm:px-7 ">
            <p-iconfield class="
         w-full
         max-width">
                <p-inputicon class="pi pi-search" />
                <input type="text"
                       class="w-full input font-medium"
                       pInputText
                       placeholder="Search" />
            </p-iconfield>
            <lib-button label="Buscar"
                        icon="pi pi-search"
                        type="rounded"
                        class="hidden sm:block">
            </lib-button>
            <lib-button width="w-10 h-10"
                        icon="pi pi-search"
                        type="rounded"
                        class="block sm:hidden">
            </lib-button>
        </div>

    </div>

    <div class="
        w-full
        flex flex-col
         items-center 
        mt-4
        gap-8
    ">
        <div class="grid grid-flow-col grid-rows-2 gap-4 w-8/10">
            <lib-product-card class="row-span-2 col-span-2"
                              [index]="1"
                              [width]="'w-10/10'"
                              [height]="'h-10/10'"></lib-product-card>
            <lib-product-card [index]="2"
                              [width]="'w-10/10'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="3"
                              [width]="'w-10/10'"
                              [height]="'h-70'"></lib-product-card>
        </div>
        <div class="w-full flex flex-row gap-8 items-center justify-center w-8/10">
            <lib-product-card [index]="1"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="2"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="3"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="4"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
        </div>
        <div class="w-full flex flex-row gap-8 items-center justify-center w-8/10">
            <lib-product-card [index]="1"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="2"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="3"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
            <lib-product-card [index]="4"
                              [width]="'w-70'"
                              [height]="'h-70'"></lib-product-card>
        </div>
    </div>

</section>
