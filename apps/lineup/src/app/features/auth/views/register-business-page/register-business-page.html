<section
  class="login flex flex-col gap-5 sm:gap-8 items-center justify-center px-0 lg:px-5 w-10/10"
>
  <a [routerLink]="['/']" class="text-center text-4xl lg:text-5xl font-medium">
    <img
      src="assets/images/lineup.png"
      alt="Lineup logo"
      width="571"
      height="505"
      class="h-30 w-auto object-contain cursor-pointer"
    />
  </a>

  <form
    [formGroup]="registerBusinessForm"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-8 items-center justify-start w-10/10 md:w-5/10 max-w-md p-10 bg-primary-50 radius shadow-lg mb-15"
  >
    <h4 class="text-center text-2xl lg:text-3xl font-medium">
      {{'general.businessRegister' | translate}}
    </h4>

    <div
      class="w-10/10 max-w-xs flex flex-col items-center justify-center gap-2 h-10"
    >
      @if (registerBusinessForm.get('acceptTerms')?.value) {
      <div #googleBtn class="google-signin-btn"></div>
      } @else {
      <p class="text-xs text-center text-primary-600 px-1">
        {{ 'auth.googleRequiresTerms' | translate }}
      </p>
      }
    </div>
    <p-floatlabel class="w-10/10 max-w-xs">
      <input
        pInputText
        class="w-10/10 font-medium"
        formControlName="name"
        id="name"
        [pSize]="'small'"
        autocomplete="off"
      />
      <label for="name" class="font-medium"
        >{{'general.businessName' | translate}}</label
      >
    </p-floatlabel>
    <p-floatlabel class="w-10/10 max-w-xs">
      <input
        pInputText
        class="w-10/10 font-medium"
        formControlName="email"
        id="email"
        [pSize]="'small'"
        autocomplete="off"
      />
      <label for="email" class="font-medium"
        >{{'general.email' | translate}}</label
      >
    </p-floatlabel>

    <p-floatlabel class="w-10/10 max-w-xs">
      <p-password
        [feedback]="false"
        class="w-10/10 font-medium"
        formControlName="password"
        [fluid]="true"
        [size]="'small'"
        [toggleMask]="true"
        inputId="password"
      />
      <label for="password" class="font-medium"
        >{{'general.password' | translate}}</label
      >
    </p-floatlabel>

    <p-floatlabel class="w-10/10 max-w-xs">
      <p-password
        [feedback]="false"
        class="w-10/10 font-medium"
        formControlName="confirmPassword"
        [fluid]="true"
        [size]="'small'"
        [toggleMask]="true"
        inputId="confirmPassword"
      />
      <label for="confirmPassword" class="font-medium"
        >{{'general.confirmPassword' | translate}}</label
      >
    </p-floatlabel>

    <div
      class="w-10/10 max-w-xs flex flex-row items-start gap-3 text-xs text-primary-800"
    >
      <input
        type="checkbox"
        id="acceptTermsBusiness"
        formControlName="acceptTerms"
        class="mt-1 shrink-0 accent-primary-600"
      />
      <label for="acceptTermsBusiness" class="leading-snug cursor-pointer">
        <span>{{ 'auth.acceptTermsIntro' | translate }}</span>
        <a
          [routerLink]="termsPath"
          target="_blank"
          rel="noopener noreferrer"
          class="text-primary-600 underline font-medium"
          (click)="$event.stopPropagation()"
          >{{ 'auth.termsLink' | translate }}</a
        >
        <span> {{ 'auth.acceptTermsAnd' | translate }} </span>
        <a
          [routerLink]="privacyPath"
          target="_blank"
          rel="noopener noreferrer"
          class="text-primary-600 underline font-medium"
          (click)="$event.stopPropagation()"
          >{{ 'auth.privacyLink' | translate }}</a
        >.
      </label>
    </div>

    <div class="w-8/10 flex flex-col items-center justify-center mt-3 gap-5">
      <lib-button
        label="{{'general.register' | translate}}"
        [type]="'rounded'"
        [size]="'small'"
        [buttonType]="'submit'"
        [width]="'w-60'"
        [disabled]="attempt"
        [loading]="attempt"
      ></lib-button>

      <lib-button
        label="{{'general.login' | translate}}"
        [link]="'/login'"
        [type]="'rounded'"
        [color]="'secondary'"
        [size]="'small'"
        [width]="'w-60'"
      ></lib-button>
    </div>
  </form>
</section>
