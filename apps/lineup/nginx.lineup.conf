server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  
  location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|svg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  
  # HTML debe refrescarse siempre
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache";
  }
}