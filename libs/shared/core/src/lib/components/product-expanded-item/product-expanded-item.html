<div class="product-expanded-item__body">
  <div class="product-expanded-item__header">
    <h3 class="product-expanded-item__title">{{ product.title }}</h3>
    @if (product.subtitle) {
      <p class="product-expanded-item__subtitle">{{ product.subtitle }}</p>
    }
  </div>

  @if (showDescription && product.description) {
    <p class="product-expanded-item__description">{{ product.description }}</p>
  }

  @if (product.price != null && product.currency) {
    <p class="product-expanded-item__price">
      {{
        product.price
          | currency
            : product.currency.code
            : 'symbol'
            : '1.0-2'
            : 'es'
      }}
    </p>
  }
</div>
