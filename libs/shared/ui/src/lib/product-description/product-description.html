<div class="flex flex-col w-full gap-5 pt-5">
  <div class="w-full flex flex-row justify-start items-center gap-6">
    <div class="flex flex-row justify-start items-center gap-2">
      <i class="pi pi-star-fill text-yellow-500" style="font-size: 2rem"></i>

      <span class="text-xl font-medium"
        >{{product.ratingAverage | number:'1.0-1':'es'}}
      </span>
      <!-- <span class="text-sm font-medium"
        >({{product.ratings?.length || 0}})</span
      > -->
    </div>

    <lib-button
      size="small"
      width="w-25"
      [label]="'general.rate'"
      (action)="openRateModal()"
    ></lib-button>
  </div>
  <div class="w-full flex flex-col gap-1">
    <div class="flex flex-col gap-2 w-full lg:w-11/12">
      <div class="product-description__content" [innerHTML]="description"></div>
    </div>
  </div>
  <div class="flex flex-col w-full gap-1 sm:gap-0">
    <lib-product-tags
      class="w-full flex flex-row flex-wrap gap-1 items-center justify-start"
      [tags]="tags"
    >
    </lib-product-tags>
  </div>
</div>
