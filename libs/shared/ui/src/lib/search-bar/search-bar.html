<div class="w-full flex flex-row items-center justify-center search-container">
  <div
    class="search flex flex-row items-center justify-between bg-white border border-[#EBEBED] rounded-full shadow-[0_4px_24px_rgba(16,17,20,0.08),0_1px_2px_rgba(16,17,20,0.04)] gap-3 pl-5 pr-2 h-[58px] max-w-[640px] w-full transition-all"
    [class.small]="small"
  >
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <i class="pi pi-search text-[#74747C] text-base shrink-0"></i>
      <input
        type="text"
        class="w-full bg-transparent border-none outline-none text-[#0B0B0C] placeholder-[#74747C] text-[15px] font-normal"
        [(ngModel)]="searchQuery"
        placeholder="{{'general.search' | translate}}"
        (keydown.enter)="onSearchSubmit()"
      />
    </div>

    <button
      type="button"
      (click)="onSearchSubmit()"
      class="w-[42px] h-[42px] rounded-full bg-[#0B0B0C] hover:bg-black text-white flex items-center justify-center transition-all cursor-pointer shrink-0 shadow-xs"
      [attr.aria-label]="'general.search' | translate"
    >
      <i class="pi pi-search text-sm"></i>
    </button>
  </div>
  <div
    class="search-ghost"
    [class.small]="small"
  ></div>
</div>
