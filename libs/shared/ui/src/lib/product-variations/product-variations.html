<div>
  <span class="font-medium font-medium text-left">{{title | translate}}:</span>
</div>
<div class="w-full flex flex-row flex-wrap items-center justify-start gap-2">
  @for (item of optionLabels(); track item.option) { @if
  (normalizeOption(item.option) === normalizeOption(selectedOption)) {

  <div
    class="min-w-20 w-auto rounded-full py-2 px-3 text-white flex flex-row items-center justify-center gap-2 select-none"
    [class.bg-gray-500]="outOfStock"
    [class.bg-primary]="!outOfStock"
    (click)="selectOption(item.option)"
    (keydown.enter)="selectOption(item.option)"
    (keydown.space)="selectOption(item.option)"
    tabindex="0"
    role="button"
  >
    @if (item.color) {
    <div>
      <div
        class="w-5 h-5 rounded-full border border-primary-100 border-1"
        [style.background-color]="item.color"
      ></div>
    </div>
    }
    <span class="text-center font-medium">{{ item.label | translate }}</span>
  </div>
  } @else {

  <div
    class="min-w-20 w-auto bg-primary-200 rounded-full py-2 px-3 flex flex-row items-center justify-center cursor-pointer gap-2 select-none"
    (click)="selectOption(item.option)"
    (keydown.enter)="selectOption(item.option)"
    (keydown.space)="selectOption(item.option)"
    tabindex="0"
    role="button"
  >
    @if (item.color) {
    <div>
      <div
        class="w-5 h-5 rounded-full border border-primary-100 border-1"
        [style.background-color]="item.color"
      ></div>
    </div>
    }
    <span class="text-center font-medium">{{ item.label | translate }}</span>
  </div>
  } }
</div>
