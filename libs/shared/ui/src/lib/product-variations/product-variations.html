<div>
  <span class="font-medium font-medium text-left">{{title}}:</span>
</div>
<div class="w-full flex flex-row flex-wrap items-center justify-start gap-2">
  @for (option of options; track $index) { @if (option === selectedOption) {
  <lib-button
    [label]="option"
    [width]="'w-20'"
    size="small"
    type="rounded"
    (action)="selectedOption = option"
  ></lib-button>
  } @else {
  <lib-button
    [label]="option"
    [width]="'w-20'"
    size="small"
    color="secondary"
    type="rounded"
    (action)="selectedOption = option"
  ></lib-button>
  } }
</div>
