<div>
    <span class="font-medium font-medium text-left">Select {{title}}:</span>
</div>
<div class="
        w-full
        flex flex-row flex-wrap
        items-center justify-start
        gap-2
    ">
    @for (item of variations; track $index) {
    @if (item.primary) {
    <lib-button [label]="item.name"
                [width]="'w-15'"
                size="small"
                type="rounded"></lib-button>
    } @else {
    <lib-button [label]="item.name"
                [width]="'w-15'"
                size="small"
                color="secondary"
                type="rounded"></lib-button>
    }
    }
</div>
