<div>
  <span class="font-medium font-medium text-left">{{title | translate}}:</span>
</div>
<div class="w-full flex flex-row flex-wrap items-center justify-start gap-2">
  @for (item of optionLabels(); track item.option) { @if (item.option ===
  selectedOption) {
  <!-- <lib-button
    [label]="item.option"
    [width]="'min-w-20 w-auto'"
    size="small"
    type="rounded"
    (action)="selectedOption = item.option"
  ></lib-button> -->

  <div
    class="min-w-20 w-auto bg-primary rounded-full py-2 px-3 text-white flex flex-row items-center justify-center cursor-pointer gap-2"
    (click)="selectedOption = item.option"
    (keydown.enter)="selectedOption = item.option"
    (keydown.space)="selectedOption = item.option"
    tabindex="0"
    role="button"
  >
    @if (item.color) {
    <div>
      <div
        class="w-5 h-5 rounded-full border border-primary-100 border-1"
        [style.background-color]="item.color"
      ></div>
    </div>
    }
    <span class="text-center">{{ item.label | translate }}</span>
  </div>
  } @else {
  <!-- <lib-button
    [label]="item.option"
    [width]="'min-w-20 w-auto'"
    size="small"
    color="secondary"
    type="rounded"
    (action)="selectedOption = item.option"
  ></lib-button> -->

  <div
    class="min-w-20 w-auto bg-primary-200 rounded-full py-2 px-3 flex flex-row items-center justify-center cursor-pointer gap-2"
    (click)="selectedOption = item.option"
    (keydown.enter)="selectedOption = item.option"
    (keydown.space)="selectedOption = item.option"
    tabindex="0"
    role="button"
  >
    @if (item.color) {
    <div>
      <div
        class="w-5 h-5 rounded-full border border-primary-100 border-1"
        [style.background-color]="item.color"
      ></div>
    </div>
    }
    <span class="text-center">{{ item.label | translate }}</span>
  </div>
  } }
</div>
