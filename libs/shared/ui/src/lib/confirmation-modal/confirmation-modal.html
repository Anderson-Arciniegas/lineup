<div class="flex flex-col gap-8">
  <p class="text-center text-lg font-medium">{{ message }}</p>
  <div class="flex flex-row justify-around items-center gap-4">
    <div class="w-30">
      <lib-button
        [label]="'general.cancel' | translate"
        [width]="'w-30'"
        (click)="cancel()"
      ></lib-button>
    </div>

    <div class="w-30">
      <lib-button
        [label]="'general.confirm' | translate"
        [width]="'w-30'"
        [color]="color"
        (click)="confirm()"
      ></lib-button>
    </div>
  </div>
</div>
