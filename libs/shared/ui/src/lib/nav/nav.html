<nav
  class="
    nav
    flex flex-row
    justify-between
    py-3
    px-4 md:px-4 lg:px-9
    bg-primary-50
    shadow
    h-18 sm:h-20"
>
  <div class="flex flex-row items-center gap-3 sm:gap-5">
    <div class="hidden">
      <lib-button
        [icon]="'pi pi-bars'"
        [variant]="'text'"
        [type]="'rounded'"
        [size]="'large'"
        width="w-13"
        (action)="visible = !visible"
      ></lib-button>
    </div>
    <a [routerLink]="['/']" class="flex flex-row items-center gap-3">
      <img
        src="assets/images/logo-2.png"
        alt="Lineup logo"
        class="h-10 sm:h-12 object-contain cursor-pointer"
      />
    </a>
    <div class="hidden sm:flex flex-row gap-1 items-center justify-center">
      <lib-button
        [link]="'/'"
        variant="text"
        color="secondary"
        [label]="'general.explore' | translate"
      ></lib-button>
      <lib-button
        [link]="'/info'"
        variant="text"
        color="secondary"
        [label]="'general.information' | translate"
      ></lib-button>
    </div>
  </div>

  <div class="flex flex-row items-center justify-end gap-3">
    @if (logged && !businessMode) {
      <lib-button
        class="hidden sm:flex"
        [link]="'profile/favorites'"
        [type]="'rounded'"
        color="secondary"
        [icon]="'pi pi-heart'"
        width="w-11"
      ></lib-button>
    }
    <lib-button
      class="flex"
      [link]="'/'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-search"
      width="w-11"
    ></lib-button>
    <lib-button
      class="hidden sm:flex"
      [link]="'/profile'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      width="w-11"
    ></lib-button>
  </div>
</nav>

<p-drawer [(visible)]="visible" header="Lineup">
  @if(!logged){
    <div class="flex flex-col items-center justify-end gap-5">
      <div class="flex flex-col gap-4 items-start justify-center w-full">
        <lib-button
          [link]="'/login'"
          [type]="'rounded'"
          variant="text"
          color="secondary"
          icon="pi pi-user"
          [width]="'w-full'"
          [label]="'general.signIn' | translate"
        ></lib-button>
        <lib-button
          [link]="'/'"
          [type]="'rounded'"
          variant="text"
          color="secondary"
          icon="pi pi-globe"
          [width]="'w-full'"
          [label]="'general.explore' | translate"
        ></lib-button>
        <lib-button
          [link]="'/info'"
          [type]="'rounded'"
          variant="text"
          color="secondary"
          icon="pi pi-info-circle"
          [width]="'w-full'"
          [label]="'general.information' | translate"
        ></lib-button>
      </div>
    </div>
  }@else if (logged && !businessMode) {
    <div class="flex flex-col items-center justify-end gap-5">
      <div class="flex flex-col gap-8 items-center justify-center">
        <lib-button
          [link]="'/'"
          [type]="'rounded'"
          variant="text"
          color="secondary"
          icon="pi pi-globe"
          [width]="'w-full'"
          [label]="'general.explore' | translate"
        ></lib-button>
        <lib-button
          [link]="'/info'"
          [type]="'rounded'"
          variant="text"
          color="secondary"
          icon="pi pi-info-circle"
          [width]="'w-full'"
          [label]="'general.information' | translate"
        ></lib-button>
        <lib-button
          [link]="'/user/favorites'"
          [type]="'rounded'"
          variant="text"
          color="secondary"
          [icon]="'pi pi-heart'"
          [width]="'w-full'"
          [label]="'general.favorites' | translate"
        ></lib-button>
      </div>
      <div>
        <lib-button
          [icon]="'pi pi-user'"
          [link]="'/user'"
          [type]="'rounded'"
          [size]="'large'"
          variant="text"
          width="w-13"
        ></lib-button>
      </div>
    </div>
  }
</p-drawer>
