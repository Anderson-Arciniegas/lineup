<nav
  class="nav flex flex-row justify-between py-3 px-3 md:px-4 lg:pe-9 bg-primary-50 shadow h-18 sm:h-20"
  [class.lg:ps-9]="!showSidebarToggle"
>
  <div class="flex flex-row items-center gap-1 sm:gap-5">
    @if (showSidebarToggle) {
    <lib-button
      [icon]="'pi pi-bars'"
      [variant]="'text'"
      [type]="'rounded'"
      [size]="'large'"
      width="w-13"
      [attr.aria-expanded]="sidebarOpen"
      [attr.aria-label]="
        (sidebarOpen
          ? 'layout.sidebar.collapseMenu'
          : 'layout.sidebar.expandMenu'
        ) | translate
      "
      (action)="emitSidebarToggle()"
    ></lib-button>
    }
    <a [routerLink]="['/']" class="flex flex-row items-center gap-3">
      <img
        src="assets/images/lineup.png"
        alt="Lineup logo"
        width="571"
        height="505"
        class="h-14 w-auto object-contain cursor-pointer"
      />
    </a>
  </div>

  <div class="flex flex-row items-center justify-end gap-2 sm:gap-4">
    <div class="hidden md:flex flex-row gap-1 items-center justify-center">
      <lib-button
        [link]="'/'"
        variant="text"
        color="secondary"
        [label]="'general.explore' | translate"
      ></lib-button>
      <lib-button
        [link]="'/info'"
        variant="text"
        color="secondary"
        [label]="'general.information' | translate"
      ></lib-button>
    </div>
    @if (!showSidebarToggle) {
    <div class="flex md:hidden gap-2 flex-row items-center justify-center">
      <lib-button
        class="flex"
        [link]="'/'"
        [type]="'rounded'"
        color="secondary"
        [fontSize]="'text-2xl'"
        variant="text"
        icon="pi pi-search"
        width="w-11"
      ></lib-button>
      <lib-button
        class="flex"
        [link]="'/info'"
        [type]="'rounded'"
        [fontSize]="'text-2xl'"
        variant="text"
        color="secondary"
        icon="pi pi-info-circle"
        width="w-11"
      ></lib-button>
    </div>
    } @if (!logged()) {
    <lib-button
      class="hidden md:flex"
      [link]="'/login'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      [label]="'general.signIn' | translate"
    ></lib-button>
    <lib-button
      class="flex md:hidden"
      [link]="'/login'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      width="w-11"
      variant="text"
      [fontSize]="'text-2xl'"
    ></lib-button>
    }@else if (!businessMode()) {

    <div
      class="flex items-center justify-center cursor-pointer w-12 h-12"
      role="button"
      tabindex="0"
      [attr.aria-label]="'notifications.title' | translate"
      (click)="userNotificationsPopover.toggle($event)"
      (keydown.enter)="userNotificationsPopover.toggle($event)"
      (keydown.space)="$event.preventDefault(); userNotificationsPopover.toggle($event)"
    >
      <p-overlay-badge
        [value]="pendingNotificationsCount()"
        [badgeDisabled]="pendingNotificationsCount() === 0"
      >
        <i class="pi pi-bell" style="font-size: 1.5rem; cursor: pointer"></i>
      </p-overlay-badge>
    </div>
    <lib-button
      class="hidden md:flex"
      [link]="'/profile'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      width="w-30"
      [label]="'general.profile' | translate"
    ></lib-button>

    <lib-button
      class="flex md:hidden"
      [link]="'/profile'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      variant="text"
      width="w-11"
      [fontSize]="'text-2xl'"
    ></lib-button>

    }@else if (businessMode()) {

    <div
      class="flex items-center justify-center cursor-pointer w-11 h-11 rounded-full hover:bg-primary-200"
      role="button"
      tabindex="0"
      [attr.aria-label]="'notifications.title' | translate"
      (click)="businessNotificationsPopover.toggle($event)"
      (keydown.enter)="businessNotificationsPopover.toggle($event)"
      (keydown.space)="$event.preventDefault(); businessNotificationsPopover.toggle($event)"
    >
      <p-overlay-badge
        [value]="pendingNotificationsCount()"
        [badgeDisabled]="pendingNotificationsCount() === 0"
      >
        <i class="pi pi-bell" style="font-size: 1.5rem; cursor: pointer"></i>
      </p-overlay-badge>
    </div>
    <lib-button
      class="hidden md:flex"
      [link]="'/dashboard'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-home"
      [label]="'general.dashboard' | translate"
    ></lib-button>
    <lib-button
      class="flex md:hidden"
      [link]="'/dashboard'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-home"
      [fontSize]="'text-2xl'"
      width="w-11"
    ></lib-button>
    }
  </div>
</nav>

<p-popover
  #userNotificationsPopover
  (onShow)="userNotificationsPanel.refresh()"
>
  <lib-notifications
    #userNotificationsPanel
    [businessMode]="false"
    (countMayHaveChanged)="refreshPendingNotificationsCount()"
  />
</p-popover>

<p-popover
  #businessNotificationsPopover
  (onShow)="businessNotificationsPanel.refresh()"
>
  <lib-notifications
    #businessNotificationsPanel
    [businessMode]="true"
    (countMayHaveChanged)="refreshPendingNotificationsCount()"
  />
</p-popover>
