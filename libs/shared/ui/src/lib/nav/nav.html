      <lib-button

      ></lib-button>
    </div>
    <a [routerLink]="['/']" class="flex flex-row items-center gap-3">
      <img
        src="assets/images/logo-2.png"
        alt="Lineup logo"
        class="h-11 sm:h-13 object-contain cursor-pointer"
      />
    </a>
  </div>

  @if(!logged){
  <div class="flex flex-row items-center justify-end gap-5 md:gap-5">
    <div class="hidden md:flex flex-row gap-2 items-center justify-center">
      <lib-button
        [link]="'/'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-globe"
        [label]="'general.explore' | translate"
      ></lib-button>
      <lib-button
        [link]="'/info'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-info-circle"

      ></lib-button>
    </div>
    <div>
      <lib-button
        [link]="'/login'"
        [type]="'rounded'"

      ></lib-button>
    </div>
  </div>
  }@else if (logged && !businessMode) {
  <div class="flex flex-row items-center justify-end gap-5 md:gap-9">
    <div class="hidden md:flex flex-row gap-2 items-center justify-center">
      <lib-button
        [link]="'/'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-globe"
        [label]="'general.explore' | translate"
      ></lib-button>

        [link]="'/info'"
        [type]="'rounded'"

        icon="pi pi-info-circle"

        [type]="'rounded'"

        [type]="'rounded'"
        color="secondary"
        icon="pi pi-user"
        width="w-11"
      ></lib-button>
    </div>

<p-drawer [(visible)]="visible" header="Lineup">
  @if(!logged){
  <div class="flex flex-col items-center justify-end gap-5">

      <lib-button
        [link]="'/login'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-user"
        [width]="'w-full'"
        [label]="'general.signIn' | translate"
      ></lib-button>
      <lib-button
        [link]="'/'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-globe"
        [width]="'w-full'"
        [label]="'general.explore' | translate"
      ></lib-button>
      <lib-button
        [link]="'/info'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-info-circle"
        [width]="'w-full'"
        [label]="'general.information' | translate"
      ></lib-button>
    </div>
  </div>
  }@else if (logged && !businessMode) {
  <div class="flex flex-col items-center justify-end gap-5">
    <div class="flex flex-col gap-8 items-center justify-center">
      <lib-button
        [link]="'/'"
        [type]="'rounded'"
        variant="text"
        color="secondary"
        icon="pi pi-globe"
        [width]="'w-full'"
        [label]="'general.explore' | translate"
      ></lib-button>
      <lib-button
        [link]="'/info'"
        [type]="'rounded'"

        color="secondary"
        icon="pi pi-info-circle"

      ></lib-button>
      <lib-button

      ></lib-button>
    </div>
  </div>
