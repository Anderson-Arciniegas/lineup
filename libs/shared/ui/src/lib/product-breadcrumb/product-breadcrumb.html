<div class="flex flex-row items-center justify-between gap-3 sm:gap-5 h-14">
  <div class="flex flex-row items-center justify-start gap-3">
    @if (!downloadMode) {
    <div class="flex flex-row items-center justify-start">
      <div class="flex flex-row items-center justify-center">
        <lib-button
          [icon]="'pi pi-arrow-left'"
          [width]="'w-13'"
          [color]="'secondary'"
          [variant]="useLightText ? null : 'text'"
          [size]="'large'"
          [type]="'rounded'"
          (action)="goBack()"
        ></lib-button>
      </div>
    </div>
    } @if (publicMode && !hiddenBusiness) {
    <div
      [ngClass]="
        downloadMode
          ? 'flex flex-row items-center justify-start gap-3'
          : 'hidden sm:flex flex-row items-center justify-start gap-3'
      "
    >
      @if (business) {
      <a
        class="flex flex-row items-center justify-center gap-3"
        [routerLink]="['/', business.path]"
        [state]="catalog ? { lineupPublicBack: '/' } : undefined"
      >
        <div
          class="flex flex-row items-center justify-center w-10 md:w-14 h-10 md:h-14 rounded"
        >
          <img
            class="w-full h-full object-cover rounded business-image"
            [src]="business.image?.url"
            alt="Shop Icon"
          />
        </div>
        <h3
          [class.text-white]="useLightText"
          class="text-sm md:text-base font-medium"
        >
          {{ business.name }}
        </h3>
      </a>
      @if (catalog) {
      <div
        [class.text-white]="useLightText"
        class="flex flex-row items-center justify-center gap-3"
      >
        @if (!downloadMode) {
        <i class="pi pi-angle-right text-xl"></i>
        }@else {
        <span class="text-xl font-medium">-</span>
        }
      </div>

      <a
        class="flex flex-row items-center justify-center gap-3"
        [routerLink]="['/', business.path, catalog.path]"
      >
        <h3
          [class.text-white]="useLightText"
          class="text-sm md:text-base font-medium"
        >
          {{ catalog.title }}
        </h3>
      </a>
      } }
    </div>
    }
  </div>

  @if (publicMode && !downloadMode) {
  <div class="flex flex-row items-center justify-end gap-3">
    <lib-button
      class="flex"
      [link]="'/'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-search"
      width="w-11"
    ></lib-button>

    @if (!logged()) {
    <lib-button
      [link]="'/login'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      width="w-11"
    ></lib-button>
    }@else if (!businessMode()) {
    <lib-button
      [link]="'/profile'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-user"
      width="w-11"
    ></lib-button>
    }@else if (businessMode()) {
    <lib-button
      [link]="'/dashboard'"
      [type]="'rounded'"
      color="secondary"
      icon="pi pi-home"
      width="w-11"
    ></lib-button>
    }
  </div>
  }
</div>
