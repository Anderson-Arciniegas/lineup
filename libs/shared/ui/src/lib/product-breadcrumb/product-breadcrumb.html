<div class="
    flex flex-row
    items-center justify-start
    gap-3 sm:gap-8
">
    <div class="
            flex flex-row
            items-center justify-start
            ">

        <div class="flex flex-row items-center justify-center">
            <lib-button [icon]="'pi pi-arrow-left'"
                        [width]="'w-17'"
                        [color]="'secondary'"
                        [variant]="'text'"
                        [size]="'large'"
                        [fontSize]="'text-2xl'"
                        [type]="'rounded'"
                        (action)="goBack()"></lib-button>
        </div>
    </div>
    <div *ngIf="business"
         class="
        flex flex-row
        items-center justify-center
        gap-3
    ">
        <div class="
            flex flex-row
            items-center justify-center
            w-10 sm:w-14 h-10 sm:h-14
            rounded
        ">
            <img class="
                    w-full h-full
                    object-cover rounded
            "
                 [src]="business.image"
                 alt="Shop Icon">
        </div>
        <h3 class="text-sm sm:text-xl font-medium">{{ business.name }}</h3>
    </div>
</div>
