<div class="flex flex-row items-center justify-start gap-3 flex-wrap sm:gap-5">
  <div class="flex flex-row items-center justify-start">
    <div class="flex flex-row items-center justify-center">
      <lib-button
        [icon]="'pi pi-arrow-left'"
        [width]="'w-13'"
        [color]="'secondary'"
        [variant]="'text'"
        [size]="'large'"
        [type]="'rounded'"
        (action)="goBack()"
      ></lib-button>
    </div>
  </div>
  @if (business) {
  <a
    class="flex flex-row items-center justify-center gap-3"
    [routerLink]="['/', business.path]"
  >
    <div
      class="flex flex-row items-center justify-center w-10 sm:w-14 h-10 sm:h-14 rounded"
    >
      <img
        class="w-full h-full object-cover rounded business-image"
        [src]="business.image?.url"
        alt="Shop Icon"
      />
    </div>
    <h3 class="text-sm sm:text-base font-medium">{{ business.name }}</h3>
  </a>
  } @if (catalog) {
  <div class="flex flex-row items-center justify-center gap-3">
    <i class="pi pi-angle-right text-xl"></i>
  </div>

  <a
    class="flex flex-row items-center justify-center gap-3"
    [routerLink]="['/', business.path, catalog.path]"
  >
    <h3 class="text-sm sm:text-base font-medium">{{ catalog.title }}</h3>
  </a>
  }
</div>
