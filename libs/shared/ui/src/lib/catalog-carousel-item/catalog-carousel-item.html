<section
  class="flex flex-col-reverse lg:flex-row items-center justify-center w-full py-4 px-1 sm:px-4 lg:px-12 gap-5 md:gap-10"
>
  <div
    class="flex flex-col items-start justify-start gap-2 sm:gap-4 w-10/10 sm:w-8/10 lg:w-4/10 h-max max-w-3xl"
  >
    <h4 class="font-bold text-xl md:text-4xl">{{ product.name }}</h4>
    <p class="text-sm md:text-lg text-gray-600">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt quae
      accusantium sequi, eligendi, accusamus dicta aliquam beatae tenetur
      provident error facere cum expedita tempora. Quidem omnis nemo animi sequi
      quas!
    </p>
    <div class="flex flex-row justify-start items-center gap-10">
      <span class="font-bold text-xl md:text-4xl"
        >{{ product.price | currency }}</span
      >
      <div class="flex flex-row items-center justify-center gap-6">
        <lib-button
          [icon]="'pi pi-heart'"
          [width]="'w-13'"
          [color]="'secondary'"
          [variant]="'text'"
          [size]="'large'"
          [type]="'rounded'"
        ></lib-button>
        <lib-button
          [icon]="'pi pi-share-alt'"
          [width]="'w-13'"
          [color]="'secondary'"
          [variant]="'text'"
          [size]="'large'"
          [type]="'rounded'"
        ></lib-button>
      </div>
    </div>
  </div>

  <img
    [id]="product.id"
    (load)="imageLoaded = true"
    [hidden]="!imageLoaded"
    class="carousel-image max-h-64 md:max-h-80 lg:max-h-screen w-10/10 sm:w-8/10 lg:w-4/10"
    [src]="product.image"
    alt=""
  />

  <div
    [hidden]="imageLoaded"
    class="carousel-image-skeleton max-h-64 md:max-h-80 lg:max-h-screen w-10/10 sm:w-8/10 lg:w-4/10 flex items-center justify-center"
  ></div>
</section>
