@if (product) {
<section
  class="flex flex-col-reverse lg:flex-row items-center justify-center w-full py-4 px-1 sm:px-4 lg:px-12 gap-5 md:gap-10"
>
  <div
    class="flex flex-col items-start justify-start gap-2 sm:gap-4 w-10/10 sm:w-8/10 lg:w-4/10 h-max max-w-3xl"
  >
    <a [routerLink]="[product.id]"
      ><h4 class="font-bold text-xl md:text-4xl">{{ product.title}}</h4></a
    >
    <p class="text-sm md:text-lg text-gray-600">{{ product?.subtitle }}</p>
    <div
      class="flex flex-col sm:flex-row justify-start items-start sm:items-center gap-2 xl:gap-10 w-full"
    >
      @if (product?.price) {
      <span class="font-bold text-xl md:text-4xl"
        >{{ product.price | currency: product?.currency?.code : 'symbol' :
        '1.0-2' : 'es' }}</span
      >
      }
      <div
        class="w-full sm:w-auto flex flex-row items-center justify-center gap-6"
      >
        <lib-button
          [icon]="hasLiked ? 'pi pi-heart-fill' : 'pi pi-heart'"
          [width]="'w-13'"
          [color]="'secondary'"
          [variant]="'text'"
          [size]="'large'"
          [type]="'rounded'"
          (action)="hasLiked ? unlikeProduct() : likeProduct()"
        ></lib-button>
        <lib-button
          [icon]="'pi pi-share-alt'"
          [width]="'w-13'"
          [color]="'secondary'"
          [variant]="'text'"
          [size]="'large'"
          [type]="'rounded'"
          (action)="share()"
        ></lib-button>
      </div>
    </div>
  </div>

  <a [routerLink]="[product.id]">
    <img
      [id]="product.id"
      class="carousel-image max-h-64 md:max-h-80 lg:max-h-screen w-10/10 sm:w-8/10 lg:w-4/10"
      [src]="product.productFiles[0].file?.url || 'assets/images/products/headphones-min.webp'"
      alt=""
    />
  </a>
</section>
}
