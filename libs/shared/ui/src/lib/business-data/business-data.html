@if (business) {
<div
  class="flex flex-col md:flex-row items-center justify-center gap-6 py-5 w-full mw-740p"
>
  <div class="flex flex-col items-center justify-center img-box">
    <img [src]="business?.image?.url" alt="Shop Icon" />
  </div>
  <div
    class="flex flex-col items-center md:items-start justify-center gap-5 sm:gap-2"
  >
    <div class="flex flex-row items-center justify-between gap-4 w-full">
      <div class="flex flex-row items-center justify-center gap-4">
        <h3 class="text-3xl font-semibold">{{business?.name}}</h3>
        <div class="flex flex-row items-center justify-center">
          <lib-button
            [icon]="'pi pi-share-alt'"
            [width]="'w-11'"
            [color]="'secondary'"
            [type]="'rounded'"
            (action)="share()"
          ></lib-button>
        </div>
      </div>

      <div class="flex flex-row items-center justify-center">
        <lib-button
          [icon]="'pi pi-pencil'"
          [label]="'general.editBusiness' | translate"
          [color]="'secondary'"
          [type]="'rounded'"
          [link]="'/dashboard/edit'"
        ></lib-button>
      </div>
    </div>

    <div class="flex flex-row items-center justify-start gap-4 h-10">
      <div class="flex items-center justify-center gap-2">
        <i class="pi pi-user" style="font-size: 1rem"></i>
        <span>1000</span>
      </div>

      <div>
        <lib-button
          [icon]="following ? 'pi pi-heart-fill' : 'pi pi-heart'"
          [label]="following ? ('general.following' | translate) : ('general.follow' | translate)"
          [color]="following ? 'secondary' : 'primary'"
          [type]="'rounded'"
          [size]="'small'"
          (action)="following = !following"
        ></lib-button>
      </div>
    </div>

    <div
      class="flex flex-col md:flex-row sm:flex-wrap items-center content-center gap-2 sm:gap-0 px-4 md:px-0"
    >
      <div class="flex flex-row items-center justify-center gap-2">
        <i class="pi pi-map-marker" style="font-size: 1rem"></i>
        <span class="font-medium font-semibold text-left">
          Valencia, Carabobo
        </span>
      </div>
      <hr class="hidden md:block h-6 border-l border-gray-300 mx-2" />
      <div class="flex flex-row items-center justify-center gap-2">
        <i class="pi pi-map-marker" style="font-size: 1rem"></i>
        <span class="font-medium font-semibold text-left">
          Tinaquillo, Cojedes
        </span>
      </div>
    </div>
    <div class="flex flex-row items-center content-center justify-center gap-5">
      @for (socialNetwork of businessSocialNetworks; track socialNetwork.id) {
      <div class="img-social-media">
        <a
          [href]="getSocialNetworkUrl(socialNetwork.socialNetwork.id)"
          target="_blank"
        >
          <img
            [src]="socialNetwork.socialNetwork.image?.url"
            [alt]="socialNetwork.socialNetwork.name"
            [title]="socialNetwork.socialNetwork.name"
          />
        </a>
      </div>
      }
    </div>
  </div>
</div>
} @else {
<div
  class="flex flex-col md:flex-row items-center justify-center gap-6 py-5 w-full mw-740p"
>
  <p-skeleton width="160px" height="160px" class="img-box" />

  <div
    class="flex flex-col items-center md:items-start justify-center gap-5 sm:gap-2 w-125"
  >
    <p-skeleton width="100%" height="46px" borderRadius="30px" />
    <p-skeleton width="100%" height="28px" borderRadius="16px" />
    <p-skeleton width="100%" height="28px" borderRadius="16px" />
    <div class="flex flex-row items-center content-center justify-center gap-5">
      <p-skeleton
        width="40px"
        height="40px"
        class="img-social-media"
        borderRadius="16px"
      />
      <p-skeleton
        width="40px"
        height="40px"
        class="img-social-media"
        borderRadius="16px"
      />
      <p-skeleton
        width="40px"
        height="40px"
        class="img-social-media"
        borderRadius="16px"
      />
    </div>
  </div>
</div>
}
