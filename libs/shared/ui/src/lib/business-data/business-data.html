<div class="
        flex 
        flex-col md:flex-row flex-wrap
        items-center
        justify-center
        gap-6
        py-5
        w-full mw-740p
    ">
    <div class="flex flex-col items-center justify-center img-box">
        <img src="assets/images/vShop.jpg"
             alt="Shop Icon">
    </div>
    <div class="flex flex-col items-center md:items-start justify-center gap-5 sm:gap-2">
        <div class="flex flex-row items-center justify-center gap-4">
            <h3 class="text-3xl font-semibold">Tu Punto vShop</h3>
            <div class="flex items-center justify-center">
                <i class="pi pi-share-alt"
                   style="font-size: 1.5rem"></i>
            </div>
        </div>
        <div class="flex flex-row items-center justify-center gap-4">
            <div class="flex items-center justify-center gap-2">
                <i class="pi pi-user"
                   style="font-size: 1rem"></i>
                <span>1000</span>
            </div>
            <lib-button label="Seguir"
                        icon="pi pi-plus"
                        [size]="'small'"
                        type="rounded"
                        color="secondary"></lib-button>
        </div>

        <div class="flex flex-col md:flex-row sm:flex-wrap items-center content-center gap-2 sm:gap-0 px-4 md:px-0">
            <div class="flex flex-row items-center justify-center gap-2">
                <i class="pi pi-map-marker"
                   style="font-size: 1rem"></i>
                <span class="font-medium font-semibold text-left">
                    Valencia, Carabobo
                </span>
            </div>
            <hr class="hidden md:block h-6 border-l border-gray-300 mx-2">
            <div class="flex flex-row items-center justify-center gap-2">
                <i class="pi pi-map-marker"
                   style="font-size: 1rem"></i>
                <span class="font-medium font-semibold text-left">
                    Tinaquillo, Cojedes
                </span>
            </div>
            <hr class="hidden md:block h-6 border-l border-gray-300 mx-2">
            <div class="flex flex-row items-center justify-center gap-2">
                <i class="pi pi-map-marker"
                   style="font-size: 1rem"></i>
                <span class="font-medium font-semibold text-left">
                    Negocio Virtual
                </span>
            </div>
        </div>
        <div class="flex flex-row items-center content-center justify-center gap-5">
            <div class="img-social-media">
                <img src="assets/images/gmail.png"
                     alt="Gmail Icon"
                     title="gmail icon">
            </div>
            <div class="img-social-media">
                <img src="assets/images/instagram.png"
                     alt="Instagram Icon"
                     title="instagram icon">
            </div>
            <div class="img-social-media">
                <img src="assets/images/whatsapp.png"
                     alt="Whatsapp Icon"
                     title="whatsapp icon">
            </div>
        </div>
    </div>
</div>
