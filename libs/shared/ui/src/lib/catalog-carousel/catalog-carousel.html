<div
  class="flex flex-col items-start justify-center w-10/10 max-h-screen rounded-xl"
>
  @if(products && products.length > 0) {
  <div class="w-10/10 max-h-screen">
    <p-carousel
      class="max-h-screen"
      [value]="products"
      [numVisible]="1"
      [numScroll]="1"
      [showIndicators]="false"
      [circular]="true"
      [responsiveOptions]="responsiveOptions"
      (onPage)="onPage($event)"
      autoplayInterval="8000"
    >
      <ng-template let-product #item>
        <section class="w-full flex flex-col items-center justify-center">
          <lib-catalog-carousel-item
            class="w-full"
            [product]="product"
          ></lib-catalog-carousel-item>
        </section>
      </ng-template>
    </p-carousel>
  </div>
  }
</div>
