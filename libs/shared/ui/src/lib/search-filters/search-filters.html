<section class="search-filter pb-5 bg-white rounded-lg">
  <p-tree
    [value]="filtersType"
    class="w-full"
    selectionMode="single"
    [highlightOnSelect]="true"
    (onNodeExpand)="onNodeExpand($event)"
    [(selection)]="selectedFilterType"
  />

  <p-tree
    [value]="filtersLocation"
    class="w-full"
    selectionMode="single"
    [highlightOnSelect]="true"
    (onNodeExpand)="onNodeExpand($event)"
    [(selection)]="selectedFilterLocation"
  />

  <p-tree
    [value]="filtersDelivery"
    class="w-full"
    selectionMode="single"
    [highlightOnSelect]="true"
    (onNodeExpand)="onNodeExpand($event)"
    [(selection)]="selectedFilterDelivery"
  />

  <div class="w-10/10 flex flex-col items-start justify-center gap-3 px-4 pl-8">
    <h3 class="font-medium text-xl">{{'general.price' | translate}}</h3>
    <div class="flex flex-col w-10/10 gap-3 pl-4 price-filter">
      <div class="flex-auto w-5/10">
        <label for="integeronly">{{'general.minimum' | translate}}</label>
        <p-inputnumber
          size="small"
          class="w-full"
          locale="es-ES"
          inputId="integeronly"
        />
      </div>

      <div class="flex-auto w-5/10">
        <label for="integeronly">{{'general.maximum' | translate}}</label>
        <p-inputnumber
          size="small"
          class="w-full"
          locale="es-ES"
          inputId="integeronly"
        />
      </div>
    </div>
  </div>

  <div class="w-full flex flex-row justify-center align-center mt-8">
    <lib-button
      [label]="'general.filter' | translate"
      type="rounded"
      class="w-8/10"
      [width]="'w-10/10'"
      (action)="saveFilters()"
    >
    </lib-button>
  </div>
</section>
