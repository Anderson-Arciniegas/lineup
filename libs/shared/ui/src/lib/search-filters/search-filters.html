<section class="search-filter pb-5 bg-white rounded-lg">
  <p-tree
    [value]="filtersType"
    class="w-full"
    selectionMode="single"
    [highlightOnSelect]="true"
    (onNodeExpand)="onNodeExpand($event)"
    [(selection)]="selectedFilterType"
  />

  <p-tree
    [value]="filtersLocation"
    class="w-full"
    selectionMode="single"
    [highlightOnSelect]="true"
    (onNodeExpand)="onNodeExpand($event)"
    [(selection)]="selectedFilterLocation"
  />

  <!-- <p-tree
    [value]="filtersDelivery"
    class="w-full"
    selectionMode="single"
    [highlightOnSelect]="true"
    (onNodeExpand)="onNodeExpand($event)"
    [(selection)]="selectedFilterDelivery"
  /> -->

  <div
    class="w-10/10 flex flex-col items-center justify-center gap-3 px-4 sm:px-8"
  >
    <h3 class="font-medium text-base w-full">
      {{'general.price' | translate}}
    </h3>
    <div
      class="flex flex-row w-10/10 gap-3 price-filter justify-between items-center"
    >
      <div class="w-5/10">
        <label for="searchFilterMinPrice" class="text-sm"
          >{{'general.minimum' | translate}}</label
        >
        <p-inputnumber
          inputId="searchFilterMinPrice"
          size="small"
          locale="es-ES"
          mode="decimal"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          [min]="0"
          [showClear]="true"
          [(ngModel)]="minPrice"
        />
      </div>

      <div class="w-5/10">
        <label for="searchFilterMaxPrice" class="text-sm"
          >{{'general.maximum' | translate}}</label
        >
        <p-inputnumber
          inputId="searchFilterMaxPrice"
          size="small"
          locale="es-ES"
          mode="decimal"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          [min]="0"
          [showClear]="true"
          [(ngModel)]="maxPrice"
        />
      </div>
    </div>
  </div>

  <div class="w-full flex flex-row justify-center align-center mt-6">
    <lib-button
      [label]="'general.filter' | translate"
      type="rounded"
      [size]="'small'"
      [width]="'w-40'"
      (action)="saveFilters()"
    >
    </lib-button>
  </div>
</section>
