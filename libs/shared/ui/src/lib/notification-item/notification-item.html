<button
  type="button"
  class="notification-item w-full text-left rounded-lg px-3 py-2 transition-colors hover:bg-primary-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
  [class.notification-item--unread]="!notification.readAt"
  (click)="onActivate()"
>
  <div class="flex flex-col gap-0.5">
    <span class="text-sm font-semibold text-surface-900 line-clamp-2">{{
      notification.title
    }}</span>
    <span class="text-xs text-surface-600 line-clamp-3">{{
      notification.body
    }}</span>
    <time
      class="text-xs text-surface-500 mt-1"
      [attr.datetime]="notification.creationDate"
    >
      {{ notification.creationDate | date: 'short' }}
    </time>
  </div>
</button>
