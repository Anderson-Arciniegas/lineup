<section class="sidebar-content" #scrollContainer (scroll)="onScroll()">
  <div class="flex flex-col justify-between gap-2 sm:gap-3 layout">
    <div class="flex flex-col gap-2 layout justify-start">
      @for (item of items.slice(0, items.length - 1); track $index) {
      <a
        [routerLink]="item.url"
        [state]="item['navigationState']"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        #rla="routerLinkActive"
        [class.bg-primary-200]="rla.isActive"
        class="sidebar-item hover:bg-primary-200"
      >
        <span class="sidebar-item__icon">
          <i class="{{ item.icon }}" style="font-size: 1.5rem"></i>
        </span>
        <span class="sidebar-item__label">
          {{ item.label | translate }}
        </span>
      </a>
      }
    </div>
    <div class="flex flex-col gap-2 justify-start">
      @for (item of items.slice(items.length - 1, items.length); track $index) {
      <div
        (click)="item.command(null)"
        (keyup.enter)="item.command(null)"
        [tabIndex]="0"
        tabindex="0"
        role="button"
        class="sidebar-item hover:bg-primary-200"
      >
        <span class="sidebar-item__icon">
          <i class="{{ item.icon }}" style="font-size: 1.5rem"></i>
        </span>
        <span class="sidebar-item__label">
          {{ item.label | translate }}
        </span>
      </div>
      }
    </div>
  </div>
</section>
@if (hasScrollbar()) {
<div class="sidebar-scrollbar" aria-hidden="true">
  <div
    class="sidebar-scrollbar__thumb"
    [style.height.px]="thumbHeight()"
    [style.transform]="'translateY(' + thumbTop() + 'px)'"
  ></div>
</div>
}
