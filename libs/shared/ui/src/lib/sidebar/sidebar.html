<section class="sidebar-content w-full py-5 px-3">
  <div class="flex flex-col justify-between gap-2 sm:gap-3 layout">
    <div class="flex flex-col gap-2 layout justify-start items-center">
      @for (item of items.slice(0, items.length - 1); track $index) {
      <a
        [routerLink]="item.url"
        [state]="item['navigationState']"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        #rla="routerLinkActive"
        [class.bg-primary-200]="rla.isActive"
        class="min-w-12 h-12 flex flex-row gap-3 items-center cursor-pointer rounded-full hover:bg-primary-200 transition-all duration-300"
        [ngClass]="
          iconOnly
            ? 'w-full justify-start p-3'
            : overlayMode
              ? 'w-full min-h-12 lg:h-12 justify-start p-3 xl:py-3 xl:px-4'
              : 'w-12 lg:w-full lg:h-12 justify-start lg:justify-start lg:p-3 xl:py-3 xl:px-4'
        "
      >
        <i class="{{ item.icon }}" style="font-size: 1.5rem"></i>
        <span
          class="font-medium text-sm xl:text-base whitespace-nowrap"
          [ngClass]="
            iconOnly
              ? 'hidden'
              : overlayMode
                ? 'block'
                : 'hidden lg:block'
          "
          >{{ item.label | translate }}</span
        >
      </a>
      }
    </div>
    <div class="flex flex-col gap-2 justify-start items-center">
      @for (item of items.slice( items.length - 1, items.length); track $index)
      {
      <div
        (click)="item.command(null)"
        (keyup.enter)="item.command(null)"
        [tabIndex]="0"
        tabindex="0"
        role="button"
        class="min-w-12 h-12 flex flex-row gap-3 items-center cursor-pointer hover:bg-primary-200 transition-all duration-300 rounded-full"
        [ngClass]="
          iconOnly
            ? 'w-full justify-start p-3'
            : overlayMode
              ? 'w-full min-h-12 lg:h-12 justify-start p-3 xl:py-3 xl:px-4'
              : 'w-12 lg:w-full lg:h-12 justify-start lg:justify-start lg:p-3 xl:py-3 xl:px-4'
        "
      >
        <i class="{{ item.icon }}" style="font-size: 1.5rem"></i>
        <span
          class="font-medium text-sm xl:text-base whitespace-nowrap"
          [ngClass]="
            iconOnly
              ? 'hidden'
              : overlayMode
                ? 'block'
                : 'hidden lg:block'
          "
          >{{ item.label | translate }}</span
        >
      </div>
      }
    </div>
  </div>
</section>
