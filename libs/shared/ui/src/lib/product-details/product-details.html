<p-panel [toggleable]="true" class="w-full">
  <ng-template #header>
    <div class="flex items-center gap-2">
      <span class="font-bold">Detalles</span>
    </div>
  </ng-template>
  <div class="w-full flex flex-col gap-3 items-start justify-start">
    @for (item of variations; track $index) {
    <lib-product-variations
      class="w-full flex flex-col gap-1 items-start justify-start"
      [title]="item.title"
      [variations]="item.variations"
    >
    </lib-product-variations>
    }
  </div>
</p-panel>
<div class="w-full flex flex-row mt-1 gap-3">
  <lib-button
    icon="pi pi-whatsapp"
    label="Contactanos"
    [href]="href"
    [target]="'_blank'"
    [width]="'w-50'"
    type="rounded"
  ></lib-button>
  <lib-button
    icon="pi pi-heart"
    [width]="'w-12'"
    type="rounded"
    color="secondary"
  ></lib-button>
</div>
