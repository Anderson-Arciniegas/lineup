<div class="flex flex-col gap-8">
  <div class="flex flex-col items-start justify-center gap-3 w-full">
    <div class="flex flex-col items-start justify-center gap-1 w-full">
      <label for="name" class="font-semibold"
        >{{'general.catalogName' | translate}}:</label
      >
      <input
        type="text"
        id="name"
        [(ngModel)]="catalogName"
        class="input w-full h-11 rounded"
        placeholder="{{'general.catalogNamePlaceholder' | translate}}"
      />
    </div>
    <div class="flex flex-col items-center justify-start gap-1 w-full">
      <label for="image" class="font-semibold w-full"
        >{{'general.imageUpload' | translate}}:</label
      >
      <div
        class="file-upload w-48 border-2 border-dashed border-gray-400 rounded-lg p-2 text-center cursor-pointer transition-colors duration-300 h-48 flex items-center justify-center"
        tabindex="0"
        (keyup.enter)="openImageCropper()"
        (click)="openImageCropper()"
        [ngClass]="{ 'border-blue-500 bg-blue-50': isDragging }"
      >
        @if (!imageUrl) {
        <div class="flex flex-col items-center text-gray-600">
          <i class="pi pi-image text-5xl mb-2" style="color: black"></i>
          <p class="text-sm">
            {{ 'general.imageUploadPlaceholder' | translate }}
          </p>
        </div>
        } @else {
        <div class="h-full w-full flex items-center justify-center">
          <img
            [src]="imageUrl"
            alt="Image selected"
            class="max-h-full max-w-full object-contain rounded-lg"
          />
        </div>
        }
      </div>
    </div>
  </div>

  <div class="w-full">
    <lib-button
      [label]="'general.save' | translate"
      [width]="'w-full'"
      (action)="createCatalog()"
    ></lib-button>
  </div>
</div>
