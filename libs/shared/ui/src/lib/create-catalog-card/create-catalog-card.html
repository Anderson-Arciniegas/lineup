<!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  tabindex="0"
  (click)="createCatalog()"
  (keyup.enter)="createCatalog()"
  [ngClass]="[width, height]"
>
  <div
    class="catalog-card border-radius shadow-xl bg-primary-950 cursor-pointer p-2 flex flex-col justify-center gap-2"
    [ngClass]="[width, height]"
  >
    <div class="flex flex-row items-center justify-center">
      <div>
        <i class="pi pi-folder-plus white" style="font-size: 5rem"></i>
      </div>
    </div>
    <div
      class="w-full text-center flex flex-row items-center justify-center title-content"
    >
      <div>
        <span class="font-medium text-2xl white"
          >{{ 'general.createCatalog' | translate }}</span
        >
      </div>
    </div>
  </div>
</div>
