<div
  cdkDropList
  cdkDropListOrientation="horizontal"
  (cdkDropListDropped)="drop($event)"
  class="draggable-image-list"
>
  @for (image of images(); track image; let i = $index) {
    <div class="image-item-wrapper" cdkDrag>
      <div class="image-item">
        <img [src]="image" [alt]="'Image ' + (i + 1)" class="image-thumb" />
        <button
          type="button"
          class="remove-btn"
          (click)="removeImage(i); $event.stopPropagation()"
          [attr.aria-label]="'Eliminar imagen ' + (i + 1)"
        >
          <span class="remove-icon" aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>
  }
</div>
