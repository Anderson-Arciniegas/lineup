<a [routerLink]="'/business-1/lineup/catalog-1'">
    <div class="border-radius p-2 shadow-lg cursor-pointer bg-primary-100 flex flex-col justify-end"
         [ngClass]="[width, height]">
        <div class="catalog-data-content flex flex-row items-center justify-between gap-3 w-10/10 font-medium text-xs">
            <div class="catalog-data-left flex flex-row items-center justify-start gap-1 w-fit px-2 py-1">
                <i class="pi pi-objects-column"
                   style="font-size: 0.8rem"></i>
                <span>999+</span>
            </div>
            <!-- <div class="catalog-data-right flex flex-row items-center justify-end gap-2 w-fit px-2 py-1">
                <i class="pi pi-objects-column"
                   style="font-size: 0.8rem"></i>
                <span>99+</span>
            </div> -->
        </div>
        <div class="h-full image-container">
            <img alt="Card"
                 class="image h-full w-full"
                 [src]="image" />
        </div>
        <div class="w-full text-center flex flex-rows items-center justify-between title-content">
            <div class="flex flex-row items-center justify-start">
                <span class="font-medium text-sm">Catalog Title</span>
            </div>
            <div class="flex items-center justify-center">
                <i class="pi pi-angle-right text-xl"></i>
            </div>
        </div>
    </div>
</a>
