<div class="share-modal-content flex flex-col gap-2 sm:gap-6">
  <div class="flex flex-col items-center justify-center">
    <qrcode
      [qrdata]="displayUrl()"
      [width]="256"
      [errorCorrectionLevel]="'M'"
    ></qrcode>
  </div>

  <div
    class="share-modal-social-row flex flex-row flex-wrap justify-center gap-3"
  >
    @for (network of shareOptions; track network.id) {
    <!-- <button
      type="button"
      class="share-modal-social-btn"
      [attr.aria-label]="network.label"
      (click)="shareOn(network)"
    >
      <i [class]="network.icon" class="share-modal-social-icon"></i>
      <span class="share-modal-social-label">{{ network.label }}</span>
    </button> -->

    <lib-button
      class="flex"
      [icon]="network.icon"
      [type]="'rounded'"
      [variant]="'text'"
      size="large"
      (action)="shareOn(network)"
    ></lib-button>

    }
  </div>

  <div class="flex flex-col sm:flex-row items-center gap-2 w-full">
    <input
      type="text"
      class="share-modal-url-input w-full sm:w-auto"
      [readonly]="true"
      [value]="displayUrl()"
      aria-label="URL para compartir"
    />
    <lib-button
      [width]="'w-40 sm:w-30'"
      [icon]="copied() ? 'pi pi-check' : 'pi pi-copy'"
      [label]="(copied() ? 'general.copied' : 'general.copy') | translate"
      [color]="copied() ? 'success' : 'primary'"
      size="small"
      (action)="copyUrl()"
    ></lib-button>
  </div>
</div>
