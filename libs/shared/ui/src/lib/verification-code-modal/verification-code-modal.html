<div class="flex flex-col gap-6 pt-4">
  <p class="text-sm text-gray-600">
    {{ 'verificationCodeModal.description' | translate }}@if (maskedEmail) {{{
    ':' + ' ' +maskedEmail }} }@else{{{ '.'}}}
  </p>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="flex flex-col items-start justify-center gap-6 w-full"
  >
    <div class="flex flex-col items-center justify-start w-full gap-2">
      <label for="code" class="font-medium mb-1 text-lg">
        {{ 'verificationCodeModal.codeLabel' | translate }}
      </label>

      <p-inputotp
        [length]="6"
        id="code"
        formControlName="code"
        autocomplete="one-time-code"
        inputmode="numeric"
        id="code"
        formControlName="code"
      />
      @if (codeControl?.invalid && (codeControl?.dirty || codeControl?.touched))
      {
      <small class="text-red-500 text-sm">
        {{ 'validation.fieldRequired' | translate }}
      </small>
      }
      <lib-button
        [label]="'verificationCodeModal.resendCode' | translate"
        [variant]="'text'"
        [buttonType]="'button'"
        [loading]="resending"
        [disabled]="resending"
        (action)="resendCode()"
      />
    </div>

    <div
      class="flex flex-col sm:flex-row justify-center items-center gap-4 w-full pt-2"
    >
      <lib-button
        [label]="'general.cancel' | translate"
        [width]="'w-35'"
        [type]="'rounded'"
        [color]="'secondary'"
        [buttonType]="'button'"
        (action)="cancel()"
      />
      <lib-button
        [label]="'general.confirm' | translate"
        [width]="'w-35'"
        [type]="'rounded'"
        [loading]="attempt"
        [buttonType]="'submit'"
      />
    </div>
  </form>
</div>
