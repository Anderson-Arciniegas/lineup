<p-button *ngIf="!link"
          class="inline-block"
          [style.width]="width"
          [label]="label"
          [icon]="icon ? icon : null"
          [loading]="loading"
          [severity]="color"
          [raised]="type === 'raised'"
          [rounded]="type === 'rounded'"
          [badge]="badge"
          [variant]="variant"
          [size]="size"
          (click)="action.emit($event)" />

<a *ngIf="link"
   [routerLink]="link">
    <p-button class="inline-block"
              [style.width]="width"
              [label]="label"
              [icon]="icon ? icon : null"
              [loading]="loading"
              [link]="linkType"
              [severity]="color"
              [raised]="type === 'raised'"
              [rounded]="type === 'rounded'"
              [badge]="badge"
              [variant]="variant"
              [size]="size" />
</a>
