@if(!link) {
<p-button class="inline-block"
          [ngClass]="[width, fontSize]"
          [label]="label"
          [icon]="icon ? icon : null"
          [loading]="loading"
          [severity]="color"
          [raised]="type === 'raised'"
          [rounded]="type === 'rounded'"
          [badge]="badge"
          [variant]="variant"
          [size]="size"
          (click)="action.emit($event)" />
} @else {
<a [routerLink]="link">
    <p-button class="inline-block"
              [ngClass]="[width, fontSize]"
              [label]="label"
              [icon]="icon ? icon : null"
              [loading]="loading"
              [link]="linkType"
              [severity]="color"
              [raised]="type === 'raised'"
              [rounded]="type === 'rounded'"
              [badge]="badge"
              [variant]="variant"
              [size]="size" />
</a>
}
