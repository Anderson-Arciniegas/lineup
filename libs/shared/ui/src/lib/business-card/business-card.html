<a [routerLink]="'/' + business?.path" [ngClass]="[width, height]">
  <div
    class="business-card p-2 shadow cursor-pointer flex flex-col justify-end bg-primary-50 w-full h-full"
  >
    <!-- <div
      class="business-data-content flex flex-row items-center justify-between gap-3 text-white font-medium w-10/10 text-xs"
    >
      @if (!favoritesMode) {
      <div
        class="business-data-left hidden sm:flex flex-row items-center justify-start gap-1 w-fit px-2 py-2"
      >
        <i class="pi pi-user" style="font-size: 0.8rem"></i>
        <span class="font-semibold"
          >{{ formatFollowers(business?.followers ?? 0) }}</span
        >
      </div>
      }
    </div> -->

    <div class="h-full image-container">
      @if (business?.image) {
      <img
        alt="Card"
        (load)="imageLoaded = true"
        [hidden]="!imageLoaded"
        class="image h-full w-full block sm:hidden"
        [src]="business.image | fileThumbnailUrl:'xs'"
      />
      <img
        alt="Card"
        (load)="imageLoaded = true"
        [hidden]="!imageLoaded"
        class="image h-full w-full hidden sm:block"
        [src]="business.image | fileThumbnailUrl:'sm'"
      />
      } @else {
      <img
        alt="Card"
        (load)="imageLoaded = true"
        [hidden]="!imageLoaded"
        class="image h-full w-full"
        [src]="image"
      />
      }
      <div
        [hidden]="imageLoaded"
        class="h-full w-full flex flex-row items-center justify-center"
        [ngClass]="[width, height]"
      >
        <p-progress-spinner
          strokeWidth="8"
          fill="transparent"
          animationDuration=".5s"
          [style]="{ width: '50px', height: '50px' }"
        />
      </div>
    </div>
    <div class="pt-2">
      <p
        class="text-center font-medium text-xs sm:text-sm whitespace-nowrap text-ellipsis overflow-hidden"
      >
        {{ business?.name ?? 'business name' }}
      </p>
    </div>
  </div>
</a>
