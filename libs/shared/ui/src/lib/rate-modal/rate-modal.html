<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6">
  <div class="flex flex-col gap-2">
    <span class="text-sm font-medium text-gray-700">
      {{ 'general.selectRating' | translate }}
    </span>
    <div class="flex flex-row gap-2 items-center">
      @for (star of stars; track star) {
      <button
        type="button"
        class="star-btn"
        (click)="setStars(star)"
        (mouseenter)="hoveredStar.set(star)"
        (mouseleave)="hoveredStar.set(0)"
        [attr.aria-label]="star + ' stars'"
      >
        <i
          style="font-size: 2rem"
          class="pi transition-colors duration-100"
          [class.pi-star-fill]="star <= (hoveredStar() || selectedStars)"
          [class.pi-star]="star > (hoveredStar() || selectedStars)"
          [class.text-yellow-400]="star <= (hoveredStar() || selectedStars)"
          [class.text-gray-300]="star > (hoveredStar() || selectedStars)"
        ></i>
      </button>
      }
    </div>
    @if (isStarsInvalid) {
    <small class="text-red-500 text-xs">
      {{ 'validation.starsRequired' | translate }}
    </small>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="comment" class="text-sm font-medium text-gray-700">
      {{ 'general.comment' | translate }}
    </label>
    <textarea
      pTextarea
      id="comment"
      formControlName="comment"
      [placeholder]="'general.commentPlaceholder' | translate"
      class="w-full resize-none"
      rows="4"
      [maxlength]="1000"
    ></textarea>
  </div>

  <div
    class="flex flex-col sm:flex-row justify-center items-center gap-4 w-full pt-2"
  >
    <lib-button
      [label]="'general.cancel' | translate"
      [width]="'w-35'"
      [type]="'rounded'"
      [color]="'secondary'"
      [buttonType]="'button'"
      (action)="cancel()"
    />
    <lib-button
      [label]="'general.rate' | translate"
      [width]="'w-35'"
      [type]="'rounded'"
      [loading]="attempt()"
      [buttonType]="'submit'"
    />
  </div>
</form>
