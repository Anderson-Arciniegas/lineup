# Uso: docker compose up --build
# La app SSR escucha en el puerto 4200. Detrás de un proxy (Nginx, Caddy) expón 80/443
# y reenvía Host / X-Forwarded-* para que las URLs absolutas del SSR sean correctas.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: production
      PORT: "4200"
      HOST: "0.0.0.0"
    restart: unless-stopped
